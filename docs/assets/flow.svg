<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Core processing flow">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6df6"/><stop offset="0.5" stop-color="#7a5cff"/><stop offset="1" stop-color="#1f9d63"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .lbl{font-size:17px;font-weight:600;fill:#191919}
      .sub{font-size:12.5px;fill:#5b6474}
      .num{font-size:12px;font-weight:700}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="#ffffff" stroke="#e7e9ee"/>

  <text x="40" y="46" class="serif" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#191919">Core Processing Flow</text>
  <text x="40" y="70" class="sub" font-size="13">Extract → Analyze → Match → Generate Questions → Rank — orchestrated by Semantic Kernel</text>

  <!-- connector beam -->
  <line x1="118" y1="176" x2="1082" y2="176" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" stroke-dasharray="964" stroke-dashoffset="964">
    <animate attributeName="stroke-dashoffset" from="964" to="0" dur="1.4s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- travelling data packets -->
  <g>
    <circle r="7" fill="#7a5cff" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M 118 176 L 1082 176"/></circle>
    <circle r="4.5" fill="#ffffff"><animateMotion dur="3.2s" repeatCount="indefinite" path="M 118 176 L 1082 176"/></circle>
    <circle r="6" fill="#2f6df6" filter="url(#glow)"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite" path="M 118 176 L 1082 176"/></circle>
  </g>

  <!-- ===== stage nodes (centres 118,311,504,697,890,1082 wait use 6 evenly) ===== -->
  <!-- centres: 160, 340, 520, 700, 880, 1040 -->
  <g>
    <!-- 1 Upload -->
    <g opacity="0" transform="translate(160,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="0.3s" fill="freeze"/>
      <circle r="30" fill="#eaf1ff" stroke="#2f6df6" stroke-width="2"/>
      <path d="M -9 4 L 0 -9 L 9 4 M 0 -9 L 0 10" fill="none" stroke="#2f6df6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="30" fill="none" stroke="#2f6df6" stroke-width="2" opacity="0.5"><animate attributeName="r" values="30;38;30" dur="2.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text class="num" fill="#2f6df6" x="0" y="52" text-anchor="middle">01</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Upload</text>
      <text class="sub" x="0" y="90" text-anchor="middle">resumes &amp; JD</text>
    </g>
    <!-- 2 Extract -->
    <g opacity="0" transform="translate(340,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="0.55s" fill="freeze"/>
      <circle r="30" fill="#e6faf1" stroke="#1f9d63" stroke-width="2"/>
      <rect x="-9" y="-11" width="18" height="22" rx="2.5" fill="none" stroke="#1f9d63" stroke-width="2.2"/>
      <path d="M -4 -3 H 4 M -4 2 H 4 M -4 7 H 1" stroke="#1f9d63" stroke-width="2" stroke-linecap="round"/>
      <text class="num" fill="#1f9d63" x="0" y="52" text-anchor="middle">02</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Extract</text>
      <text class="sub" x="0" y="90" text-anchor="middle">Doc Intelligence</text>
    </g>
    <!-- 3 Match -->
    <g opacity="0" transform="translate(520,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="0.8s" fill="freeze"/>
      <circle r="30" fill="#efeaff" stroke="#7a5cff" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#7a5cff" stroke-width="2.2"/><circle r="3" fill="#7a5cff"/>
      <path d="M 7 7 L 12 12" stroke="#7a5cff" stroke-width="2.4" stroke-linecap="round"/>
      <text class="num" fill="#7a5cff" x="0" y="52" text-anchor="middle">03</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Match · RAG</text>
      <text class="sub" x="0" y="90" text-anchor="middle">fit score + gaps</text>
    </g>
    <!-- 4 Questions -->
    <g opacity="0" transform="translate(700,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.05s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="1.05s" fill="freeze"/>
      <circle r="30" fill="#fff1e6" stroke="#e08a1e" stroke-width="2"/>
      <path d="M -6 -4 A 6 6 0 1 1 2 5 L 2 8" fill="none" stroke="#e08a1e" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="2" cy="13" r="1.8" fill="#e08a1e"/>
      <text class="num" fill="#e08a1e" x="0" y="52" text-anchor="middle">04</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Questions</text>
      <text class="sub" x="0" y="90" text-anchor="middle">Interview Agent</text>
    </g>
    <!-- 5 Rank -->
    <g opacity="0" transform="translate(880,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="1.3s" fill="freeze"/>
      <circle r="30" fill="#e6faf1" stroke="#1f9d63" stroke-width="2"/>
      <rect x="-10" y="0" width="5" height="9" fill="#1f9d63"/><rect x="-2.5" y="-6" width="5" height="15" fill="#1f9d63"/><rect x="5" y="-11" width="5" height="20" fill="#1f9d63"/>
      <text class="num" fill="#1f9d63" x="0" y="52" text-anchor="middle">05</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Rank</text>
      <text class="sub" x="0" y="90" text-anchor="middle">shortlist</text>
    </g>
    <!-- 6 Review -->
    <g opacity="0" transform="translate(1040,176)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 0" dur="0.5s" begin="1.55s" fill="freeze"/>
      <circle r="30" fill="#eaf1ff" stroke="#2f6df6" stroke-width="2"/>
      <path d="M -8 0 L -2 7 L 9 -7" fill="none" stroke="#2f6df6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="num" fill="#2f6df6" x="0" y="52" text-anchor="middle">06</text>
      <text class="lbl" x="0" y="72" text-anchor="middle">Review</text>
      <text class="sub" x="0" y="90" text-anchor="middle">Reviewer Agent</text>
    </g>
  </g>
</svg>
